<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Paste or draw a Chinese character and see its meaning part, sound part, words, example sentences and origin.">
<title>Character Decoder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lexend:wght@400;500&family=Noto+Sans:wght@500;700&family=Noto+Sans+SC:wght@400;500&family=Outfit:wght@400;500;700&display=swap">
<style>
/* Layout: a dark stage, ivory ink, one red seal. One character fills the left; what it is made of runs down the right.
   The look is the house style of Sixty Radicals; here a colour belongs to a part's job: meaning, sound, picture. */
:root {
  color-scheme: dark;
  --bg: #0A0A10;
  --bg2: #17172A;
  --panel: #181926;
  --panel2: #1F2032;
  --line: #2D2F45;
  --ink: #F7F2E8;
  --muted: #A2A5BC;
  --dim: #5A5D78;
  --red: #F2452F;
  --c-meaning: #3DB8FF;
  --c-sound: #FFB23E;
  --c-iconic: #6FE39A;
  --c-other: #A78BFA;
  --f-display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --f-ui: "Outfit", system-ui, sans-serif;
  --f-read: "Lexend", "Outfit", system-ui, sans-serif;
  --f-py: "Noto Sans", "Outfit", system-ui, sans-serif;
  --f-zh: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --bar-h: 60px;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 17px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
#app { min-height: 100vh; display: flex; flex-direction: column; }
#view { flex: 1; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 8px; }

.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.red { color: var(--red); }
.dim { color: var(--muted); }
.small { font-size: 0.86rem; }
.sub { color: var(--muted); font-family: var(--f-read); max-width: 62ch; }
.eyebrow { font-weight: 700; font-size: 0.76rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.py { font-family: var(--f-py); font-weight: 500; }
.zh { font-family: var(--f-zh); }
h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; letter-spacing: 0.01em; text-wrap: balance; }
h3 { font-size: 1.05rem; font-weight: 700; line-height: 1.25; }
a.out { color: var(--ink); text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 4px; }
a.out:hover { text-decoration-color: var(--ink); }
a.out::after { content: " ↗"; color: var(--muted); }

/* ---- characters drawn from stroke outlines */
.hz { display: block; width: 100%; height: 100%; }
.hz path { fill: var(--ink); transition: opacity 0.2s; }
.hz .draw { fill: none; stroke: var(--ink); stroke-width: 220; stroke-linecap: round; stroke-linejoin: round; }
.hz path.r-meaning { fill: var(--c-meaning); } .hz .draw.r-meaning { stroke: var(--c-meaning); }
.hz path.r-sound { fill: var(--c-sound); } .hz .draw.r-sound { stroke: var(--c-sound); }
.hz path.r-iconic { fill: var(--c-iconic); } .hz .draw.r-iconic { stroke: var(--c-iconic); }
.hz path.r-other { fill: var(--c-other); } .hz .draw.r-other { stroke: var(--c-other); }
@keyframes hz-draw { to { stroke-dashoffset: 0; } }
@keyframes hz-show { to { opacity: 1; } }

/* ---- buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 26px;
  border-radius: 999px; border: 2px solid var(--line); background: var(--panel); color: var(--ink);
  font-weight: 700; font-size: 0.86rem; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; line-height: 1.2;
  transition: transform 0.15s, border-color 0.15s, background 0.15s; }
.btn:hover { border-color: var(--muted); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: default; transform: none; border-color: var(--line); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: #ff5a44; border-color: #ff5a44; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 40px; padding: 8px 16px; font-size: 0.74rem; }
.listen { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line);
  color: var(--muted); vertical-align: middle; flex: none; }
.listen:hover { color: var(--ink); border-color: var(--muted); }
/* buttons that need the device's own Mandarin voice only show when it has one */
.listen.voice-only { display: none; }
.has-voice .listen.voice-only { display: inline-grid; }

/* ---- the red seal */
.seal { display: inline-grid; place-items: center; width: 38px; height: 38px; padding: 5px; border-radius: 10px; background: var(--red);
  transform: rotate(-4deg); flex: none; }
.seal .hz path { fill: #fff; }

/* ---- top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; height: var(--bar-h); padding: 0 var(--gut-r) 0 var(--gut-l);
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; min-height: 44px; min-width: 0; }
.brand-name { font-family: var(--f-display); font-size: 1.25rem; letter-spacing: 0.06em; white-space: nowrap; }
.bar-right { display: flex; align-items: center; gap: 8px; }
body[data-view="home"] .bar-right { display: none; }

.toast { position: fixed; left: 50%; top: calc(var(--bar-h) + 14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40;
  max-width: calc(100vw - 32px); padding: 12px 22px; border-radius: 999px; background: var(--ink); color: var(--bg);
  font-weight: 700; font-size: 0.92rem; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); animation: toast-in 0.25s ease-out; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -12px); } }

/* ---- character tiles: a pasted sentence, the drawing pad's guesses, things to try */
.strip-row, .try-row, .guesses { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tile, .guess { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--panel); font-size: 1.55rem; line-height: 1; transition: border-color 0.15s, transform 0.15s; }
a.tile:hover, .guess:hover { border-color: var(--muted); transform: translateY(-2px); }
.tile.now { border-color: var(--red); background: color-mix(in srgb, var(--red) 16%, var(--panel)); }
.tile.plain { border-color: transparent; background: none; width: auto; min-width: 16px; color: var(--muted); }
.field-label { display: block; font-weight: 700; font-size: 0.74rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }

@media (max-width: 520px) {
  .brand-name { font-size: 1.02rem; }
  .tile, .guess { width: 44px; height: 44px; font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* ---- home: the lookup box on the left, the drawing pad on the right */
.hero { background: radial-gradient(ellipse at 70% 30%, var(--bg2), var(--bg) 70%); border-bottom: 1px solid var(--line); }
.hero-in { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: clamp(28px, 5vw, 64px); align-items: start;
  padding-top: clamp(32px, 6vw, 72px); padding-bottom: clamp(36px, 6vw, 72px); }
.hero-text { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.6rem, 6.6vw, 4.8rem); line-height: 1.02; letter-spacing: 0.01em; text-wrap: balance; }
.lede { font-family: var(--f-read); font-size: clamp(1rem, 1.5vw, 1.14rem); color: var(--muted); max-width: 52ch; }

.lookup { display: flex; flex-direction: column; gap: 10px; }
.lookup textarea { width: 100%; padding: 14px 18px; border-radius: 18px; border: 2px solid var(--line); background: var(--panel); color: var(--ink);
  font-family: var(--f-zh); font-size: 1.5rem; line-height: 1.4; resize: vertical; min-height: 64px; }
.lookup textarea::placeholder { color: var(--dim); }
.lookup textarea:focus { outline: none; border-color: var(--ink); }
.lookup-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.sample, .try { display: flex; flex-direction: column; gap: 10px; }

.draw-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pad { display: flex; flex-direction: column; gap: 12px; }
.pad-box { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1; border-radius: 28px; border: 3px solid var(--line); background-color: var(--panel);
  /* the practice-paper cross that Chinese schoolchildren write in */
  background-image: linear-gradient(var(--line), var(--line)), linear-gradient(var(--line), var(--line));
  background-size: 1px 86%, 86% 1px; background-position: center; background-repeat: no-repeat; overflow: hidden; }
.pad-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.pad-hint { position: absolute; inset: auto 0 18px; text-align: center; color: var(--dim); font-weight: 500; pointer-events: none; }
.pad-tools { display: flex; gap: 10px; }
.guesses { min-height: 48px; }
.guess-label { color: var(--muted); font-weight: 700; font-size: 0.74rem; letter-spacing: 0.18em; text-transform: uppercase; margin-right: 4px; }

/* ---- bands */
.band { padding: clamp(44px, 7vw, 80px) 0; scroll-margin-top: var(--bar-h); }
.band h2 { margin: 10px 0 14px; }
#what { background: linear-gradient(180deg, var(--bg), var(--bg2) 60%, var(--bg)); }
.five { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 28px 32px; margin-top: 26px; counter-reset: five; }
.five li { counter-increment: five; border-top: 2px solid var(--line); padding-top: 14px; }
.five li::before { content: counter(five); font-family: var(--f-display); font-size: 1.5rem; color: var(--dim); }
.five h3 { display: flex; align-items: center; gap: 8px; margin: 4px 0 6px; }
.five p { color: var(--muted); font-family: var(--f-read); font-size: 0.94rem; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.dot.r-meaning { background: var(--c-meaning); }
.dot.r-sound { background: var(--c-sound); }
.credits { display: flex; flex-direction: column; gap: 14px; max-width: 70ch; color: var(--muted); font-family: var(--f-read); font-size: 0.95rem; }

@media (max-width: 860px) {
  .hero-in { grid-template-columns: minmax(0, 1fr); }
  .pad-box { max-width: 360px; }
}

/* ---- one character taken apart */
.decode { padding: 22px 0 80px; }
.decode > .wrap { display: flex; flex-direction: column; gap: 22px; }
.loading { color: var(--muted); font-family: var(--f-read); padding: 60px 0; text-align: center; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 60px 0; }
.big-zh { font-size: 5rem; line-height: 1; }

.strip { display: flex; flex-direction: column; gap: 8px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.strip-label { font-weight: 700; font-size: 0.74rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }

.dec-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
.dec-hero { position: sticky; top: calc(var(--bar-h) + 20px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stage-box { position: relative; width: 100%; max-width: 340px; aspect-ratio: 1; padding: 22px; border-radius: 32px; background: var(--panel); border: 3px solid var(--line);
  background-image: linear-gradient(var(--line), var(--line)), linear-gradient(var(--line), var(--line));
  background-size: 1px 84%, 84% 1px; background-position: center; background-repeat: no-repeat; }
.stage { width: 100%; height: 100%; }
/* pointing at a part's card dims the rest of the character */
.stage[data-lit="0"] path:not(.part-0), .stage[data-lit="1"] path:not(.part-1), .stage[data-lit="2"] path:not(.part-2),
.stage[data-lit="3"] path:not(.part-3), .stage[data-lit="4"] path:not(.part-4) { opacity: 0.22; }
.replay { position: absolute; right: 14px; bottom: 10px; padding: 6px 4px; color: var(--muted); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.replay:hover { color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.legend .r-meaning, .c-meaning { color: var(--c-meaning); }
.legend .r-sound, .c-sound { color: var(--c-sound); }
.legend .r-iconic { color: var(--c-iconic); }
.legend .r-other { color: var(--c-other); }
.readings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.reading { display: inline-flex; align-items: center; gap: 8px; font-size: 1.9rem; line-height: 1.1; }
.reading.minor { font-size: 1.15rem; color: var(--muted); }
.share { font-family: var(--f-ui); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.gloss { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 4.4vw, 2.9rem); line-height: 1.05; letter-spacing: 0.01em; text-wrap: balance; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 8px; color: var(--muted); font-size: 0.88rem; }
.facts li { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.facts strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.facts a { color: var(--ink); font-size: 1.1rem; text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; }

.dec-body { display: flex; flex-direction: column; gap: 44px; min-width: 0; }
.sec { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sec h3 { margin-top: 8px; color: var(--muted); font-size: 0.92rem; font-weight: 500; }

/* parts: the glyph in its colour on the left, what it does on the right */
.parts { display: flex; flex-direction: column; gap: 12px; }
.part { --rc: var(--c-other); display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 18px; padding: 18px; border-radius: 22px; background: var(--panel);
  border: 2px solid var(--line); }
.part.r-meaning { --rc: var(--c-meaning); }
.part.r-sound { --rc: var(--c-sound); }
.part.r-iconic { --rc: var(--c-iconic); }
.part-glyph { display: grid; place-items: center; width: 76px; height: 76px; border-radius: 18px; background: color-mix(in srgb, var(--rc) 13%, var(--bg)); color: var(--rc);
  font-size: 2.7rem; line-height: 1; }
a.part-glyph:hover { background: color-mix(in srgb, var(--rc) 24%, var(--bg)); }
.part-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.part-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.role { font-weight: 700; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--rc); }
.role.rad-tag { color: var(--bg); background: var(--rc); padding: 1px 8px; border-radius: 999px; letter-spacing: 0.12em; }
.part-name { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 1.2rem; }
.part-name .py { color: var(--muted); }
.part-note, .match p { color: var(--muted); font-family: var(--f-read); font-size: 0.93rem; }
.match { display: flex; flex-direction: column; gap: 4px; }
.match-head { display: flex; align-items: center; gap: 10px; }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 16px; height: 8px; border-radius: 3px; background: var(--line); }
.meter i.on { background: var(--c-sound); }
.match .zh, .part-note .zh { color: var(--ink); font-size: 1.1em; }
.sibs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.sibs-label { flex-basis: 100%; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.sib { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 10px; border-radius: 10px; border: 1px solid var(--line); }
.sib:hover { border-color: var(--muted); }
.sib .zh { font-size: 1.25rem; }
.sib .py { font-size: 0.82rem; color: var(--muted); }
.part-links { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.88rem; }
/* a part's own parts, hung underneath it like replies in a thread */
.thread { grid-column: 1 / -1; position: relative; display: flex; flex-direction: column; gap: 10px; margin: 2px 0 0 37px; padding-left: 22px;
  border-left: 2px solid var(--line); }
.thread-head { padding-top: 6px; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.thread-head .zh { color: var(--rc); font-size: 1.35em; letter-spacing: 0; margin-right: 4px; }
.thread-note { color: var(--muted); font-family: var(--f-read); font-size: 0.93rem; }
.thread-note .zh { color: var(--ink); font-size: 1.1em; }
.thread-list { display: flex; flex-direction: column; gap: 10px; }
.kid { --rc: var(--c-other); position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: center;
  padding: 12px 14px; border-radius: 16px; background: var(--panel2); border: 1px solid var(--line); }
.kid.r-meaning { --rc: var(--c-meaning); }
.kid.r-sound { --rc: var(--c-sound); }
.kid.r-iconic { --rc: var(--c-iconic); }
.kid::before { content: ""; position: absolute; left: -24px; top: 50%; width: 23px; height: 2px; background: var(--line); }
/* the thread line stops at the last reply */
.kid:last-child::after { content: ""; position: absolute; left: -24px; top: calc(50% + 2px); bottom: -2px; width: 2px; background: var(--panel); }
.kid-glyph { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 12px; background: color-mix(in srgb, var(--rc) 13%, var(--bg));
  color: var(--rc); font-size: 1.8rem; line-height: 1; }
a.kid-glyph:hover { background: color-mix(in srgb, var(--rc) 24%, var(--bg)); }
.kid-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kid-name { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 1.05rem; }
.kid-name .py { color: var(--muted); }
.kid .listen { width: 30px; height: 30px; }

.rad-line { color: var(--muted); font-family: var(--f-read); font-size: 0.93rem; }
.rad-line .zh { color: var(--ink); font-size: 1.15em; }

/* tappable Chinese: every character is a way into its own page */
.tap a { border-radius: 4px; }
.tap a:hover { background: var(--panel2); }
.tap a.now { color: var(--red); }

.words { display: flex; flex-direction: column; }
.word { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 14px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.word:last-child { border-bottom: 1px solid var(--line); }
/* a word opens its own page; the chevron says so */
.word-main { display: grid; grid-template-columns: minmax(96px, auto) minmax(0, 1fr) 16px; gap: 4px 18px; align-items: center; padding: 8px 10px; margin-left: -10px;
  border-radius: 14px; min-width: 0; }
a.word-main:hover { background: var(--panel); }
a.word-main::after { content: "›"; color: var(--dim); font-size: 1.6rem; line-height: 1; }
a.word-main:hover::after { color: var(--ink); }
.word-zh { display: flex; align-items: center; font-size: 1.6rem; line-height: 1.2; white-space: nowrap; }
.word-zh .now { color: var(--red); }
.word-info { display: flex; flex-direction: column; min-width: 0; }
.word-info .py { color: var(--muted); font-size: 0.92rem; }
.word-gloss { font-family: var(--f-read); font-size: 0.97rem; overflow-wrap: anywhere; }
.hsk { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.word .hsk { min-width: 76px; text-align: center; }
.hsk.none { border: 0; padding: 0; }

.pairs { display: flex; flex-wrap: wrap; gap: 10px; }
.pair { display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
.pair-zh { display: flex; align-items: center; gap: 6px; font-size: 1.4rem; }
.plus { color: var(--dim); font-size: 1rem; }

.examples { display: flex; flex-direction: column; gap: 18px; }
.example { display: flex; flex-direction: column; gap: 2px; padding-left: 16px; border-left: 2px solid var(--line); }
.ex-zh { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 1.4rem; line-height: 1.4; }
.ex-py { color: var(--muted); font-size: 0.92rem; }

.origin-text { font-family: var(--f-read); font-size: 1.06rem; max-width: 62ch; }
.origin-text .zh, .memory .zh { font-size: 1.15em; }
.origin-old { color: var(--muted); font-family: var(--f-read); font-size: 0.95rem; }
.source { color: var(--dim); font-size: 0.8rem; }
.verified { margin-left: 10px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--c-iconic); color: var(--c-iconic); font-weight: 700; white-space: nowrap; }
.memory { border-style: dashed; }
.memory-label { font-weight: 700; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.memory p:not(.memory-label):not(.source) { font-family: var(--f-read); font-size: 1.06rem; }
.more { font-size: 0.92rem; }
.inline-zh { text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 4px; color: var(--ink); font-size: 1.2em; margin: 0 2px; }

  .dec-grid { grid-template-columns: minmax(0, 1fr); }

@media (max-width: 520px) {

/* ---- one word: the word large, its meanings, then the characters it is made of side by side */

.word-body { display: flex; flex-direction: column; gap: 44px; padding-top: 18px; }
.word-head { display: flex; flex-direction: column; gap: 12px; }

.word-head .readings { gap: 10px 14px; }

.wchar:hover { border-color: var(--muted); transform: translateY(-2px); }
.wchar-glyph { width: 112px; height: 112px; padding: 10px; border-radius: 18px; background: var(--bg);
  background-image: linear-gradient(var(--line), var(--line)), linear-gradient(var(--line), var(--line));

.wchar-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wchar-top { display: flex; align-items: center; gap: 8px; font-size: 1.4rem; }
.wchar-gloss { font-size: 1.1rem; overflow-wrap: anywhere; }
.wchar-kind { color: var(--muted); font-size: 0.86rem; }
.wchar-parts { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: 0.9rem; font-weight: 500; }
.wchar-parts .zh { font-size: 1.2em; }
.wchar-parts .r-meaning { color: var(--c-meaning); }
.wchar-parts .r-sound { color: var(--c-sound); }
.wchar-parts .r-iconic { color: var(--c-iconic); }
.wchar-parts .r-other { color: var(--c-other); }
.wchar-go { margin-top: auto; padding-top: 8px; font-weight: 700; font-size: 0.74rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.wchar-go::after { content: " ›"; }
.wchar:hover .wchar-go { color: var(--ink); }
.tap .now { color: var(--red); }
.ex-tag { margin-top: 2px; font-size: 0.78rem; color: var(--dim); }

@media (max-width: 520px) {

  .wchar-glyph { width: 84px; height: 84px; font-size: 3.4rem; }
}

<script>
"use strict";
// ---------------------------------------------------------------- data
// The page carries only the list of characters. Everything else is fetched in small files when it is needed:
// data/d/<n>.json (what we know about a character), data/s/<n>.json (its stroke outlines),
// data/rec.txt (for the drawing pad) and data/a/<n>.json (spoken syllables).
const INDEX = window.DECODER_DATA;
const CHARS = [...INDEX.chars];
const RANK = new Map(CHARS.map((c, i) => [c, i]));
const known = (ch) => RANK.has(ch);
const CLIPSET = new Set(INDEX.clips || []);

const files = {};
function getJSON(path) {
  return (files[path] ||= fetch(path).then((r) => { if (!r.ok) throw new Error(path); return r.json(); })
    .catch((e) => { delete files[path]; throw e; }));
}
const entryOf = (ch) => getJSON(`data/d/${ch.codePointAt(0) % INDEX.nData}.json`).then((d) => d[ch]);
const STROKES = Object.assign({}, INDEX.strokes);
const strokesOf = (ch) => (STROKES[ch] ? Promise.resolve(STROKES[ch])
  : getJSON(`data/s/${ch.codePointAt(0) % INDEX.nStroke}.json`).then((d) => { Object.assign(STROKES, d); return STROKES[ch]; }));

// ---------------------------------------------------------------- small helpers
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const SVGNS = "http://www.w3.org/2000/svg";
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/** el("div.card", {onclick}, child, child...). An id may follow the classes: el("section.band#how"). */
function el(spec, attrs, ...kids) {
  const [head, id] = spec.split("#");
  const [tag, ...cls] = head.split(".");
  const node = document.createElement(tag || "div");
  if (cls.length) node.className = cls.join(" ");
  if (id) node.id = id;
  if (attrs && (typeof attrs !== "object" || attrs instanceof Node || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") {
      for (const [prop, val] of Object.entries(v)) { if (prop.startsWith("--")) node.style.setProperty(prop, val); else node.style[prop] = val; }
    }
    else if (k === "html") node.innerHTML = v;
    else node.setAttribute(k, v === true ? "" : v);
  }
  const add = (kid) => {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) kid.forEach(add);
    else node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  };
  kids.forEach(add);
  return node;
}

const HAN_RE = /[㐀-鿿]/;
const hashOf = (ch) => "#c-" + ch.codePointAt(0).toString(16);
const zh = (text, cls) => el("span.zh" + (cls ? "." + cls : ""), { lang: "zh-Hans" }, text);
const py = (text) => el("span.py", text);

// ---------------------------------------------------------------- what the visitor typed, kept for this tab
const STORE_KEY = "character-decoder-v1";
let state = { text: "", recent: [] };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); } catch (e) { /* private window */ }
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } };
function remember(ch) {
  state.recent = [ch, ...state.recent.filter((c) => c !== ch)].slice(0, 14);
  save();
}

// ---------------------------------------------------------------- characters, drawn stroke by stroke
// Every stroke is its own outline, so each part of a character can take its own colour.
// While a stroke is being drawn, a fat line runs along its centre line, clipped to the outline.
let uid = 0;
const STROKE_S = 0.3;
/**
 * hanzi("清", { anim, parts }) -> svg. The outlines must already be loaded (strokesOf).
 * parts: [{ s: [stroke numbers], role: "meaning" | "sound" | "iconic" | "other" }]
 */
function hanzi(ch, opt = {}) {
  const g = STROKES[ch];
  if (!g) return zh(ch, "hz-font");
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 1024 1024");
  svg.setAttribute("class", "hz" + (opt.cls ? " " + opt.cls : ""));
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", ch);
  const root = document.createElementNS(SVGNS, "g");
  root.setAttribute("transform", "scale(1,-1) translate(0,-900)");
  svg.append(root);
  const roleOf = {};
  (opt.parts || []).forEach((p, pi) => (p.s || []).forEach((i) => { roleOf[i] = `r-${p.role} part-${pi}`; }));
  const anim = opt.anim && !reduceMotion();
  const n = g.s.length;
  const step = n > 1 ? Math.min(0.22, 2.2 / (n - 1)) : 0;
  g.s.forEach((d, i) => {
    const kind = roleOf[i] || "r-none";
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", kind);
    if (!anim) { root.append(path); return; }
    const at = (opt.delay || 0) + i * step;
    const id = "hz" + (++uid);
    const clip = document.createElementNS(SVGNS, "clipPath");
    clip.setAttribute("id", id);
    const cp = document.createElementNS(SVGNS, "path");
    cp.setAttribute("d", d);
    clip.append(cp);
    const line = document.createElementNS(SVGNS, "polyline");
    const m = g.m[i];
    let len = 140;
    for (let k = 1; k < m.length; k++) len += Math.hypot(m[k][0] - m[k - 1][0], m[k][1] - m[k - 1][1]);
    line.setAttribute("points", m.map((p) => p.join(",")).join(" "));
    line.setAttribute("clip-path", `url(#${id})`);
    line.setAttribute("class", "draw " + kind);
    line.style.strokeDasharray = `${len} ${len}`;
    line.style.strokeDashoffset = len;
    line.style.animation = `hz-draw ${STROKE_S}s ${at}s ease-out forwards`;
    path.style.opacity = 0;
    path.style.animation = `hz-show 0.01s ${at + STROKE_S}s forwards`;
    root.append(clip, line, path);
  });
  return svg;
}

// ---------------------------------------------------------------- sound
// Single syllables are recorded clips (the "Serena" voice used on the sister sites). Words and sentences use the
// browser's own Mandarin voice when the device has one.
const MARKS = { ā: "a1", á: "a2", ǎ: "a3", à: "a4", ē: "e1", é: "e2", ě: "e3", è: "e4", ī: "i1", í: "i2", ǐ: "i3", ì: "i4", ō: "o1", ó: "o2",
  ǒ: "o3", ò: "o4", ū: "u1", ú: "u2", ǔ: "u3", ù: "u4", ǖ: "v1", ǘ: "v2", ǚ: "v3", ǜ: "v4", ü: "v0", ń: "n2", ň: "n3", ǹ: "n4" };
/** "qīng" -> "qing1" (light tone 5), the name of its clip */
function clipId(pinyin) {
  let tone = 5, out = "";
  for (const ch of pinyin.toLowerCase()) {
    if (MARKS[ch]) { out += MARKS[ch][0]; if (MARKS[ch][1] !== "0") tone = Number(MARKS[ch][1]); }
    else if (/[a-z]/.test(ch)) out += ch;
  }
  return out + tone;
}
const clipChunk = (id) => { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 9973; return h % INDEX.nAudio; };

let actx = null, playing = null;
const BUFS = {};
function playClip(id) {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    actx.resume();
    const start = (buf) => {
      try { playing?.stop(); } catch (e) { /* already over */ }
      playing = actx.createBufferSource();
      playing.buffer = buf;
      playing.connect(actx.destination);
      playing.start();
    };
    if (BUFS[id]) { start(BUFS[id]); return; }
    getJSON(`data/a/${clipChunk(id)}.json`).then((d) => {
      const bin = atob(d[id]), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return actx.decodeAudioData(bytes.buffer);
    }).then((buf) => { BUFS[id] = buf; start(buf); }).catch(() => {});
  } catch (e) { /* no audio */ }
}

let zhVoice = null;
function findVoice() {
  try {
    const vs = window.speechSynthesis.getVoices().filter((v) => /^zh([-_](CN|Hans))?/i.test(v.lang) && !/HK|TW|yue/i.test(v.lang));
    zhVoice = vs.find((v) => /CN/i.test(v.lang) && v.localService) || vs.find((v) => /CN/i.test(v.lang)) || vs[0] || null;
  } catch (e) { zhVoice = null; }
  document.documentElement.classList.toggle("has-voice", Boolean(zhVoice));
}
if ("speechSynthesis" in window) {
  findVoice();
  try { window.speechSynthesis.addEventListener("voiceschanged", findVoice); } catch (e) { /* older browsers */ }
}
function speak(text) {
  if (!zhVoice) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = zhVoice; u.lang = zhVoice.lang; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } catch (e) { /* no speech */ }
}

const SPEAKER_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
/** Listen button for one syllable: the recorded clip, or the device voice reading the character when there is no clip. */
function listenSyllable(pinyin, ch) {
  const id = clipId(pinyin);
  const has = CLIPSET.has(id);
  return el("button.listen" + (has ? "" : ".voice-only"), { type: "button", title: "Listen", "aria-label": `Listen to ${pinyin}`,
    onclick: (e) => { e.stopPropagation(); e.preventDefault(); if (has) playClip(id); else speak(ch); }, html: SPEAKER_SVG });
}
/** Listen button for a word or sentence. It only shows on devices that have a Mandarin voice. */
function listenText(text) {
  return el("button.listen.voice-only", { type: "button", title: "Listen (your device's voice)", "aria-label": `Listen to ${text}`,
    onclick: (e) => { e.stopPropagation(); e.preventDefault(); speak(text); }, html: SPEAKER_SVG });
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 2800);
}

/** Chinese text in which every character we can decode is a link to its page. */
function tappable(text, current) {
  const out = el("span.zh.tap", { lang: "zh-Hans" });
  for (const ch of text) {
    if (known(ch)) out.append(el("a" + (ch === current ? ".now" : ""), { href: hashOf(ch) }, ch));
    else out.append(ch);
  }
  return out;
}

// ---------------------------------------------------------------- which character was drawn?
// Every character's strokes are stored as five points each, in a box that hugs the character (see prep.py).
// A drawing is cut down the same way and compared stroke against stroke. Stroke order and direction are
// rewarded when they are right, but a wrong order still finds the character.
const REC = (() => {
  const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  const VAL = {};
  for (let i = 0; i < 64; i++) VAL[B64[i]] = i / 63 - 0.5;
  const K = 5, STEP = K * 2;
  let byCount = null;       // stroke count -> [{ch, rank, pts: Float32Array}]

  function load(text) {
    byCount = {};
    text.split("\n").forEach((line, rank) => {
      const ch = String.fromCodePoint(line.codePointAt(0));
      const code = line.slice(ch.length);
      const pts = new Float32Array(code.length);
      for (let i = 0; i < code.length; i++) pts[i] = VAL[code[i]];
      const n = code.length / STEP;
      (byCount[n] ||= []).push({ ch, rank, pts, n });
    });
  }

  function resample(pts) {
    const seg = [];
    let total = 0;
    for (let i = 0; i + 1 < pts.length; i++) { const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(d); total += d; }
    if (!total) return Array.from({ length: K }, () => pts[0]);
    const out = [];
    let acc = 0, i = 0;
    for (let j = 0; j < K; j++) {
      const want = (total * j) / (K - 1);
      while (i < seg.length - 1 && acc + seg[i] < want) { acc += seg[i]; i++; }
      const t = seg[i] ? Math.min(1, (want - acc) / seg[i]) : 0;
      out.push([pts[i][0] + t * (pts[i + 1][0] - pts[i][0]), pts[i][1] + t * (pts[i + 1][1] - pts[i][1])]);
    }
    return out;
  }

  /** strokes: [[[x, y], ...], ...] in any units, y pointing down -> the same five-point form as the stored characters */
  function encode(strokes) {
    const rs = strokes.map(resample);

// ---------------------------------------------------------------- the drawing pad
// Draw a character with a finger or the mouse. After every stroke the likeliest characters appear underneath.
let recLoading = null;
function loadRec() {
  return (recLoading ||= fetch("data/rec.txt").then((r) => { if (!r.ok) throw new Error("rec"); return r.text(); })
    .then((t) => REC.load(t)).catch((e) => { recLoading = null; throw e; }));

function drawPad(onPick) {
  const canvas = el("canvas.pad-canvas", { width: 600, height: 600, "aria-label": "Drawing area. Draw one character.", role: "img" });
  const hint = el("p.pad-hint", "Draw one character here");
  const guesses = el("div.guesses", { "aria-live": "polite" });
  const undoBtn = el("button.btn.small.ghost", { type: "button", disabled: true }, "Undo stroke");
  const clearBtn = el("button.btn.small.ghost", { type: "button", disabled: true }, "Clear");
  const strokes = [];
  let cur = null;
  const ctx = canvas.getContext("2d");
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function paint() {
    ctx.clearRect(0, 0, 600, 600);
    ctx.lineCap = ctx.lineJoin = "round";
    ctx.lineWidth = 15;
    ctx.strokeStyle = css("--ink");
    for (const s of cur ? [...strokes, cur] : strokes) {
      ctx.beginPath();
      s.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      if (s.length === 1) ctx.lineTo(s[0][0] + 0.1, s[0][1]);
      ctx.stroke();
    }
    hint.hidden = strokes.length > 0 || Boolean(cur);
    undoBtn.disabled = clearBtn.disabled = !strokes.length;
  }

  function guess() {
    if (!strokes.length) { guesses.replaceChildren(); return; }
    if (!REC.ready()) {
      guesses.replaceChildren(el("span.dim", "Loading the character shapes…"));
      loadRec().then(guess).catch(() => guesses.replaceChildren(el("span.dim", "The character shapes could not be loaded. Check your connection and draw another stroke.")));
      return;
    }
    const found = REC.match(strokes, 8);
    guesses.replaceChildren(el("span.guess-label", "Is it"),
      ...found.map((f) => el("button.guess", { type: "button", "aria-label": `Decode ${f.ch}`, onclick: () => onPick(f.ch) }, zh(f.ch))));
  }

  const at = (ev) => {
    const box = canvas.getBoundingClientRect();
    return [((ev.clientX - box.left) / box.width) * 600, ((ev.clientY - box.top) / box.height) * 600];
  };
  canvas.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* synthetic pointer */ }
    cur = [at(ev)];
    paint();
  });
  canvas.addEventListener("pointermove", (ev) => {
    if (!cur) return;
    const p = at(ev), last = cur[cur.length - 1];
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) > 3) { cur.push(p); paint(); }
  });
  const end = () => {
    if (!cur) return;
    strokes.push(cur);
    cur = null;
    paint();
    guess();
  };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  undoBtn.addEventListener("click", () => { strokes.pop(); paint(); guess(); });
  clearBtn.addEventListener("click", () => { strokes.length = 0; paint(); guess(); });
  paint();
  // fetch the shapes as soon as the pad is on screen, so the first stroke gets an answer at once
  setTimeout(() => loadRec().catch(() => {}), 600);
  return el("div.pad",
    el("div.pad-box", canvas, hint),
    el("div.pad-tools", undoBtn, clearBtn),
    guesses);
}

  }

  // ---- where it comes from, and how to keep it
  const origin = el("section.sec", el("p.eyebrow", "Where it comes from"));
  const text = plainOrigin(e);
  if (text) {
    origin.append(el("div.origin",
      el("p.origin-text", noteText(text)),
      e.om ? el("p.origin-old", "Original meaning: ", el("strong", e.om), ".") : null,
      el("p.source", e.o ? (text === e.o ? "From the Dong Chinese character wiki" : "From the Dong Chinese character wiki, reworded") : "From Make Me a Hanzi",
        e.v ? el("span.verified", { title: "Checked by the wiki's editors against published research" }, "checked by its editors") : null)));
  } else {
    origin.append(el("p.sub", "No origin note has been written for this character yet."));
  }
  const mem = memoryLine(ch, e);
  if (mem) origin.append(el("div.memory", el("p.memory-label", "To remember it"), mem, el("p.source", "Put together by this site from the parts above")));
  origin.append(el("p.more", el("a.out", { href: DONG_URL + encodeURIComponent(ch), target: "_blank", rel: "noopener" },
    "Its oldest written forms on Dong Chinese")));
  body.append(origin);

  if (e.tt) {
    body.append(el("p.more", el("a.out", { href: `${TONES_URL}#s-${e.tt}`, target: "_blank", rel: "noopener" },
      `Hear ${e.tt} in all four tones in the Mandarin Tone Trainer`)));
  }
  return el("div.dec-grid", hero, body);
}

// ---------------------------------------------------------------- one word, and the characters it is made of
const wordHash = (w) => "#w-" + [...w].map((c) => c.codePointAt(0).toString(16)).join("-");
/** Must match word_chunk() in prep.py. */
function wordChunk(w) {
  let h = 0;
  for (const c of w) h = (h * 31 + c.codePointAt(0)) % 9973;
  return h % INDEX.nWord;
}
const wordOf = (w) => getJSON(`data/w/${wordChunk(w)}.json`).then((d) => d[w]);

/** A sentence in which every known character links to its page and the word itself is lit. */
function tappableWord(text, word) {
  const chars = [...text], wl = [...word].length, lit = new Set();
  for (let k = 0; k + wl <= chars.length; k++) {
    if (chars.slice(k, k + wl).join("") === word) for (let j = k; j < k + wl; j++) lit.add(j);
  }
  return el("span.zh.tap", { lang: "zh-Hans" }, chars.map((c, i) => (known(c)
    ? el("a" + (lit.has(i) ? ".now" : ""), { href: hashOf(c) }, c)
    : el("span" + (lit.has(i) ? ".now" : ""), c))));
}

function charCard(c, e, syl) {
  if (!e) return el("li.wchar", el("div.wchar-glyph", zh(c, "hz-font")));
  const comps = e.c || [];
  const parts = comps.map((x) => ({ s: x.s, role: mainRole(x.r || []) }));
  const reading = syl || (e.p && e.p[0] ? e.p[0][0] : "");
  return el("li",
    el("a.wchar", { href: hashOf(c), "aria-label": `${c}, ${e.g || ""}. Take it apart` },
      el("div.wchar-glyph", hanzi(c, { parts })),
      el("div.wchar-body",
        el("div.wchar-top", reading ? py(reading) : null, reading ? listenSyllable(reading, c) : null),
        el("strong.wchar-gloss", e.g || "—"),
        el("span.wchar-kind", (KIND[e.k] || KIND.other)[0]),
        comps.length ? el("ul.wchar-parts", comps.map((x) => el("li.r-" + mainRole(x.r || []), zh(x.c), x.g ? ` ${x.g}` : ""))) : null,
        el("span.wchar-go", "Take it apart"))));
}

function wordView(word) {
  const view = el("section.decode.wordpage");
  const wrap = el("div.wrap");
  view.append(wrap);
  wrap.append(el("p.loading", "Looking up ", zh(word), "…"));
  const chars = [...word];
  Promise.all([wordOf(word).catch(() => null), ...chars.map((c) => (known(c) ? entryOf(c).catch(() => null) : Promise.resolve(null)))])
    .then(([wd, ...ents]) => Promise.all(chars.filter(known).map((c) => strokesOf(c).catch(() => null))).then(() => [wd, ents]))
    .then(([wd, ents]) => { $(".loading", wrap)?.remove(); wrap.append(wordBody(word, wd, ents)); })
    .catch(() => { $(".loading", wrap)?.replaceChildren("This word could not be loaded. Check your connection and try again."); });
  return view;
}

function wordBody(word, wd, ents) {
  const chars = [...word];
  const syl = (wd && wd.s && wd.s.length === chars.length) ? wd.s : [];
  const head = el("header.word-head",
    el("p.eyebrow", "Word"),
    el("h1.word-big", { lang: "zh-Hans" }, word),
    el("div.readings", wd ? el("span.reading", py(wd.p)) : null, listenText(word),
      wd && wd.hsk ? el("span.hsk", wd.hsk >= 7 ? "HSK 7–9" : `HSK ${wd.hsk}`) : null),
    wd ? el("ol.word-defs", wd.d.map((d) => el("li", d))) : el("p.sub", "No dictionary entry for this word."));
  const parts = el("section.sec",
    el("p.eyebrow", chars.length === 2 ? "Its two characters" : `Its ${chars.length} characters`),
    el("ul.wchars", chars.map((c, i) => charCard(c, ents[i], syl[i]))));
  const out = el("div.word-body", head, parts);
  if (wd && wd.x) {
    const own = wd.x.some((x) => x[3]);
    out.append(el("section.sec", el("p.eyebrow", "In a sentence"),
      el("ul.examples", wd.x.map(([s, p, en, mine]) => el("li.example",
        el("div.ex-zh", tappableWord(s, word), listenText(s)),
        el("div.ex-py", py(p)),
        el("div.ex-en", en),
        mine ? el("span.ex-tag", "AI-written, not yet checked by a Chinese speaker") : null))),
      el("p.source", own ? "Examples from Wiktionary, and ones written for this site" : "Examples from Wiktionary")));
  }
  return out;
}

// ---------------------------------------------------------------- home: type, paste or draw

function lookUp(text) {
  const chars = [...text].filter((c) => HAN_RE.test(c));
  if (!chars.length) { toast("Type or paste some Chinese characters first"); return; }
  const first = chars.find(known);
  if (!first) { toast("None of those characters are in the decoder yet"); return; }
  state.text = chars.length > 1 ? text.trim().slice(0, 300) : "";
  save();
  if (location.hash === hashOf(first)) render(true); else location.hash = hashOf(first);
}

function homeView() {
  const input = el("textarea#lookup-text", { rows: 2, placeholder: "清 or 我想喝一杯清水", lang: "zh-Hans", autocomplete: "off", autocapitalize: "off",
    spellcheck: "false", "aria-label": "Chinese characters to decode" });
  input.value = state.text || "";
  const form = el("form.lookup#lookup", { onsubmit: (ev) => { ev.preventDefault(); lookUp(input.value); } },
    el("label.field-label", { for: "lookup-text" }, "Type or paste"),
    input,
    el("div.lookup-row",
      el("button.btn.primary", { type: "submit" }, "Decode"),
      el("span.dim.small", "One character, a word or a whole sentence")));
  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); lookUp(input.value); } });

  const pad = el("div.draw-side", el("p.field-label", "Or draw it"), drawPad((ch) => { state.text = ""; save(); location.hash = hashOf(ch); }));

  const hero = el("section.hero", el("div.wrap.hero-in",
    el("div.hero-text",
      el("p.eyebrow", "Character decoder"),
      el("h1", "Take any character ", el("span.red", "apart.")),
      el("p.lede", "Paste a character or draw one. See which part carries the meaning, which part carries the sound, the words it lives in, and why it looks the way it does."),
      form),
    pad));

  const what = el("section.band#what", el("div.wrap",
    el("p.eyebrow", "What you get for each character"),
    el("h2", "Five things, one page"),
    el("ol.five",
      el("li", el("h3", el("i.dot.r-meaning"), "The meaning part"), el("p", "Usually the radical. It tells you what kind of thing the character is about: water, speech, a hand, the heart.")),
      el("li", el("h3", el("i.dot.r-sound"), "The sound part"), el("p", "The other half hints at how to say it. A four-bar meter shows how far you can trust the hint today.")),
      el("li", el("h3", "Words"), el("p", "The everyday words the character appears in, most used first, with pinyin and HSK level.")),
      el("li", el("h3", "Sentences"), el("p", "Short example sentences that show it at work, with pinyin and a translation.")),
      el("li", el("h3", "Where it comes from"), el("p", "What the people who designed it were picturing, and a line to remember it by.")))));

  const dumpDate = INDEX.dump || "";
  const about = el("section.band#about", el("div.wrap",
    el("p.eyebrow", "Sources"),
    el("h2", "Whose work this is"),
    el("div.credits",
      el("p", "Parts, origin notes and word lists come from the ", el("a.out", { href: "https://www.dong-chinese.com/wiki", target: "_blank", rel: "noopener" }, "Dong Chinese character wiki"),
        dumpDate ? ` (data of ${dumpDate})` : "", ", shared under the Creative Commons Attribution-ShareAlike 4.0 licence. This site's character data is shared under the same licence."),
      el("p", "Stroke outlines, stroke order and dictionary radicals come from ", el("a.out", { href: "https://github.com/skishore/makemeahanzi", target: "_blank", rel: "noopener" }, "Make Me a Hanzi"),
        ". Word meanings come from CC-CEDICT. Example sentences and phrases, with their pinyin and translations, come from ",
        el("a.out", { href: "https://en.wiktionary.org/wiki/Wiktionary:Main_Page", target: "_blank", rel: "noopener" }, "Wiktionary"),
        " (CC BY-SA 4.0), where editors write them to show one word at work."),
      el("p", "Sister sites: ", el("a.out", { href: SIXTY_URL, target: "_blank", rel: "noopener" }, "Sixty Radicals"), ", ",
        el("a.out", { href: TONES_URL, target: "_blank", rel: "noopener" }, "Mandarin Tone Trainer"), " and ",
        el("a.out", { href: "https://a-c-pack.github.io/pinyin-starter/", target: "_blank", rel: "noopener" }, "Pinyin Starter"), "."))));

  return el("div.home", hero, what, about);
}

// ---------------------------------------------------------------- routes, start-up
function route() {
  const h = (location.hash || "#home").slice(1);
  const m = h.match(/^c-([0-9a-f]{4,6})$/i);
  if (m) {
    const ch = String.fromCodePoint(parseInt(m[1], 16));
    return { kind: "decode", key: h, make: () => decodeView(ch) };
  }
  const w = h.match(/^w-([0-9a-f]{4,6}(?:-[0-9a-f]{4,6})+)$/i);
  if (w) {
    const word = w[1].split("-").map((x) => String.fromCodePoint(parseInt(x, 16))).join("");
    return { kind: "word", key: h, make: () => wordView(word) };
  }
  return { kind: "home", key: "home", make: homeView, anchor: ["what", "about", "lookup"].includes(h) ? h : null };
}

let lastKey = null;
function render(force) {
  const r = route();
  const view = $("#view");
  try { window.speechSynthesis?.cancel(); } catch (e) { /* no speech */ }
  if (r.key === lastKey && !force && view.firstChild) {
    if (r.anchor) document.getElementById(r.anchor)?.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth" });
    return;
  }
  lastKey = r.key;
  view.replaceChildren(r.make());
  document.body.dataset.view = r.kind;
  if (r.anchor) requestAnimationFrame(() => document.getElementById(r.anchor)?.scrollIntoView());
  else window.scrollTo({ top: 0 });
}

function start() {
  $("#brand-seal").append(hanzi("解"));
  window.addEventListener("hashchange", () => render());
  render(true);
}
start();

</script>
</body>
